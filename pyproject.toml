[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "project-os"
version = "0.2.0"
description = "Project-scoped memory, task contracts and deterministic controls for long-running AI agent work."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
projectctl = "projectctl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/projectctl"]

[tool.hatch.build.targets.wheel.force-include]
"scaffold/default" = "projectctl/_scaffold/default"
"defaults" = "projectctl/_defaults"
"schemas" = "projectctl/_schemas"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
