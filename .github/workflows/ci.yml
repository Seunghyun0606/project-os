name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Base scaffold smoke test
        run: |
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          projectctl init --project-id smoke --name "Smoke Project"
          projectctl doctor
          test ! -f .qa/manifest.yaml
      - name: Optional QA scaffold smoke test
        run: |
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          projectctl init --project-id qa-smoke --name "QA Smoke Project" --with-qa
          projectctl doctor
          test -f .qa/manifest.yaml
          test -f .qa/scripts/run-qa.ps1
          test -f .qa/scripts/run-qa.sh
          set +e
          sh .qa/scripts/run-qa.sh --run-id QA-CI-UNIX
          qa_exit=$?
          set -e
          test "$qa_exit" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path(".qa/runs/QA-CI-UNIX/result.json").read_text(encoding="utf-8"))
          assert result["schemaVersion"] == "2.0"
          assert result["status"] == "FAIL"
          assert result["errors"][0]["code"] == "QA_NOT_CONFIGURED"
          PY

  qa-scaffold-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 QA scaffold smoke test
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scaffold\qa\.qa\scripts\run-qa.ps1 -RunId QA-CI
          $qaExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($qaExitCode -ne 1) {
            throw "Unconfigured QA scaffold must exit 1, got $qaExitCode"
          }

          $resultPath = ".\scaffold\qa\.qa\runs\QA-CI\result.json"
          if (-not (Test-Path $resultPath)) {
            throw "QA result was not created: $resultPath"
          }

          $bytes = [System.IO.File]::ReadAllBytes($resultPath)
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            throw "result.json must be UTF-8 without BOM"
          }

          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          if ($result.schemaVersion -ne "2.0") {
            throw "Unexpected QA schema version: $($result.schemaVersion)"
          }
          if ($result.status -ne "FAIL") {
            throw "Unconfigured QA scaffold must report FAIL"
          }
          if ($result.errors[0].code -ne "QA_NOT_CONFIGURED") {
            throw "Expected QA_NOT_CONFIGURED"
          }
