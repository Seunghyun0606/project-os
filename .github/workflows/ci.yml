name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Base scaffold smoke test
        run: |
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          projectctl init --project-id smoke --name "Smoke Project"
          projectctl doctor
          test ! -f scripts/qa.ps1
      - name: Optional QA scaffold smoke test
        run: |
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          projectctl init --project-id qa-smoke --name "QA Smoke Project" --with-qa
          projectctl doctor
          test -f scripts/qa.ps1
          test -f qa/result.example.json

  qa-scaffold-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 QA scaffold smoke test
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scaffold\qa\scripts\qa.ps1 -RunId QA-CI
          if ($LASTEXITCODE -ne 1) {
            throw "Unconfigured QA scaffold must exit 1, got $LASTEXITCODE"
          }

          $resultPath = ".\scaffold\qa\.qa\runs\QA-CI\result.json"
          if (-not (Test-Path $resultPath)) {
            throw "QA result was not created: $resultPath"
          }

          $bytes = [System.IO.File]::ReadAllBytes($resultPath)
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            throw "result.json must be UTF-8 without BOM"
          }

          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          if ($result.schema_version -ne "1.0") {
            throw "Unexpected QA schema version: $($result.schema_version)"
          }
          if ($result.status -ne "FAIL") {
            throw "Unconfigured QA scaffold must report FAIL"
          }
          if ($result.errors[0].code -ne "QA_NOT_CONFIGURED") {
            throw "Expected QA_NOT_CONFIGURED"
          }
